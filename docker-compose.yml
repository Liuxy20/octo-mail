# Local end-to-end stack for octo-mail: PostgreSQL 17 + MinIO (real S3) + the
# node itself. Brings up the full runtime the way the acceptance tests exercise
# it — SMTP MX/submission, IMAP, JMAP+webmail, admin+metrics.
#
#   docker compose up -d --build
#   ...run e2e...
#   docker compose down -v
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: octo_mail
      POSTGRES_PASSWORD: octo_mail
      POSTGRES_DB: octo_mail
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octo_mail -d octo_mail"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19010:9000"
      - "19011:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  octo-mail:
    build: .
    image: octo-mail:local
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      OCTO_MAIL_DSN: "postgres://octo_mail:octo_mail@postgres:5432/octo_mail?sslmode=disable"
      OCTO_MAIL_HOSTNAME: "mail.octo-mail.test"
      # Real S3 via MinIO (exercises the content-addressed S3 blob path).
      OCTO_MAIL_S3_ENDPOINT: "http://minio:9000"
      OCTO_MAIL_S3_REGION: "us-east-1"
      OCTO_MAIL_S3_BUCKET: "octo-mail"
      OCTO_MAIL_S3_PREFIX_PATH: "${OCTO_MAIL_S3_PREFIX_PATH:-}"
      OCTO_MAIL_S3_ACCESS: "minioadmin"
      OCTO_MAIL_S3_SECRET: "minioadmin"
      # Listen addresses (container-internal; mapped below).
      OCTO_MAIL_SMTP_ADDR: ":25"
      OCTO_MAIL_SUBMISSION_ADDR: ":587"
      OCTO_MAIL_IMAP_ADDR: ":143"
      OCTO_MAIL_JMAP_ADDR: ":8080"
      # Advertise the externally reachable JMAP resources. Standalone use keeps
      # localhost; an OCTO gateway deployment sets this to
      # https://<octo-origin>/agent-mail-api.
      OCTO_MAIL_JMAP_BASEURL: "${OCTO_MAIL_JMAP_BASEURL:-http://localhost:8090}"
      # Browser authorization must use the same public OCTO origin as the
      # signed-in web app. Override this for HTTPS/custom-domain deployments;
      # never point users at a container or alternate browser origin.
      OCTO_MAIL_AUTHORIZATION_URL: "${OCTO_MAIL_AUTHORIZATION_URL:-http://localhost:28080/mail/authorize}"
      OCTO_MAIL_ADMIN_ADDR: ":8081"
      OCTO_MAIL_ADMIN_TOKEN: "e2e-admin-token"
      # Optional OCTO identity gateway. Keep the secret in an uncommitted .env
      # and configure the same value on octo-server.
      OCTO_MAIL_GATEWAY_SECRET: "${OCTO_MAIL_GATEWAY_SECRET:-}"
      # Bot-to-Bot automatic-reply chains are enabled by default with a maximum
      # of four replies. Keep the HMAC key in the uncommitted .env and share the
      # same value across octo-mail instances.
      OCTO_MAIL_AUTO_REPLY_MAX_COUNT: "${OCTO_MAIL_AUTO_REPLY_MAX_COUNT:-4}"
      # One human owner may register at most two Agent mailboxes per Space.
      OCTO_MAIL_MAX_AGENT_MAILBOXES_PER_OWNER_SPACE: "${OCTO_MAIL_MAX_AGENT_MAILBOXES_PER_OWNER_SPACE:-2}"
      # Product address domain for newly registered Agent mailboxes. The domain
      # must be provisioned for the authenticated tenant in octo-mail.
      OCTO_MAIL_AGENT_MAILBOX_DOMAIN: "${OCTO_MAIL_AGENT_MAILBOX_DOMAIN:-mail.imocto.cn}"
      OCTO_MAIL_AUTO_REPLY_CHAIN_KEY: "${OCTO_MAIL_AUTO_REPLY_CHAIN_KEY:-}"
      # Optional local workflow test adapter. Example: "付款,合同". Empty keeps
      # existing Agent sends unchanged; final product rules are not hard-coded here.
      OCTO_MAIL_OUTBOUND_REVIEW_TERMS: "${OCTO_MAIL_OUTBOUND_REVIEW_TERMS:-}"
      # Enforce DMARC so the security-posture default is exercised in acceptance.
      OCTO_MAIL_REJECT_DMARC: "1"
      OCTO_MAIL_NODE_ID: "e2e-node-1"
    # Loopback MX for the test domains: outbound delivery to acme.test/other.test
    # (no real DNS) resolves to this container itself, so a send goes out via SMTP
    # and comes back into our own MX — a full send->receive round trip locally.
    extra_hosts:
      - "acme.test:127.0.0.1"
      - "other.test:127.0.0.1"
      - "demo.octo.test:127.0.0.1"
      - "mail.imocto.cn:127.0.0.1"
      - "mail.octo-mail.test:127.0.0.1"
    ports:
      - "2525:25"     # SMTP MX
      - "5587:587"    # SMTP submission
      - "1143:143"    # IMAP
      - "8090:8080"   # JMAP + webmail
      - "8091:8081"   # admin + /metrics + /healthz
    # No container healthcheck: the distroless runtime has no shell/curl. The e2e
    # harness polls http://localhost:8081/healthz from the host instead.
